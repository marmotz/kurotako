name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Smoke — tako --version under Node
        run: node packages/cli/dist/bin/tako.js --version
      - name: Smoke — tako --version under Bun
        run: bun packages/cli/dist/bin/tako.js --version
      - name: Smoke — kurotako meta bin --version under Node
        run: |
          expected=$(node -p "require('./packages/kurotako/package.json').version")
          got=$(node packages/kurotako/dist/bin/tako.js --version)
          test "$got" = "$expected" || { echo "expected $expected, got $got"; exit 1; }
      - name: Smoke — kurotako meta bin --version under Bun
        run: |
          expected=$(node -p "require('./packages/kurotako/package.json').version")
          got=$(bun packages/kurotako/dist/bin/tako.js --version)
          test "$got" = "$expected" || { echo "expected $expected, got $got"; exit 1; }
