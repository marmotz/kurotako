name: Release

# Manual, two-phase release (changesets). Run it twice:
#   1. Dispatch with unreleased changesets present -> changesets/action opens (or refreshes)
#      the "Version Packages" PR: it runs `changeset version`, which bumps every
#      package.json, writes the CHANGELOGs and consumes the changeset files. Nothing is
#      published. Review and merge that PR.
#   2. Dispatch again on the merged commit -> no changesets remain, so the publish step
#      below runs `scripts/release-publish.sh`.
#
# Publishing does NOT go through `changeset publish`:
#   - `changeset publish` shells to `bun publish` (packageManager is bun), and bun does
#     not support npm OIDC trusted publishing.
#   - `npm publish` supports OIDC but does not rewrite the `workspace:` protocol.
#   `scripts/release-publish.sh` packs each package with bun (rewrites `workspace:^`) and
#   uploads the tarball with `npm publish` (authenticates via OIDC, `--provenance`).
#
# Auth: npm OIDC trusted publishing, no `NPM_TOKEN`. Each package must have a trusted
# publisher configured on npmjs.org (repo `marmotz/kurotako`, workflow `release.yml`).
# A brand-new package cannot have one yet, so the FIRST publish of each package is done
# manually from a maintainer's machine (`npm login` + `bun run release`); every release
# after that runs here.
#
# `actions/setup-node` must NOT set `registry-url`: it would write an `.npmrc` with a
# placeholder `_authToken` that npm prefers over the OIDC token exchange (npm/cli#8730).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance + OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - name: Create "Version Packages" PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bash scripts/release-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
